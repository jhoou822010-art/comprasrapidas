# Gera o app Android (Trusted Web Activity) da loja para enviar à Google Play.
# Como usar: aba Actions > "Gerar app Android (Play Store)" > Run workflow.
# Ao terminar, baixe o artefato "app-android": o arquivo .aab vai para a Play Console;
# o .apk serve para instalar e testar direto no celular.
#
# Precisa de 2 segredos (Settings > Secrets and variables > Actions):
#   ANDROID_UPLOAD_KEY_BASE64  -> conteúdo do upload-key.base64.txt
#   ANDROID_KEY_PASSWORD       -> senha da chave
name: Gerar app Android (Play Store)

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão exibida na loja (ex.: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir se o domínio já está no ar
        run: |
          D=https://comprasrapidasandrade.com.br
          for f in manifest.json icon-512.png .well-known/assetlinks.json; do
            if ! curl -sfL -o /dev/null "$D/$f"; then
              echo "::error::$D/$f ainda não abre. Espere o domínio (com HTTPS) entrar no ar e o site ser publicado com a pasta .well-known, depois rode de novo."
              exit 1
            fi
          done
          echo "Domínio no ar com HTTPS."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Bubblewrap
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Preparar projeto Android
        env:
          KEY_B64: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
          VERSAO: ${{ inputs.versao }}
        run: |
          if [ -z "$KEY_B64" ]; then echo "::error::Falta o segredo ANDROID_UPLOAD_KEY_BASE64"; exit 1; fi
          mkdir -p ~/.bubblewrap build-android
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          # o número interno da versão precisa subir a cada envio: usa o número desta execução
          jq --arg v "$VERSAO" --argjson c "$((GITHUB_RUN_NUMBER + 1))" \
            '.appVersionName=$v | .appVersion=$v | .appVersionCode=$c' \
            android/twa-manifest.json > build-android/twa-manifest.json
          echo "$KEY_B64" | base64 -d > build-android/upload-key.jks
          cd build-android
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Compilar e assinar
        working-directory: build-android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          bubblewrap build --manifest=./twa-manifest.json
          mkdir -p ../saida
          cp app-release-bundle.aab ../saida/compras-rapidas-${{ inputs.versao }}.aab
          cp app-release-signed.apk ../saida/compras-rapidas-${{ inputs.versao }}.apk
          rm -f upload-key.jks

      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: saida/
          retention-days: 30
