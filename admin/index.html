<!doctype html><html lang=pt-BR><head><meta charset=utf-8><meta name=color-scheme content="only light"><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content=noindex><link rel=manifest href=manifest.json><meta name=theme-color content="#0b2a5b"><link rel=icon href=icon-192.png><link rel=apple-touch-icon href=apple-touch-icon.png><meta name=mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-title content=Painel><title>Painel | Compras Rápidas</title><link rel=stylesheet href=../css/style.css>
<style>.ad{display:flex;flex-wrap:wrap;gap:6px;background:var(--c1);padding:8px}.ad button{background:#ffffff22;color:#fff;border:0;padding:10px 12px;border-radius:8px;cursor:pointer}.ad button.on{background:var(--c2)}
label{display:block;margin:8px 0;font-size:.9rem}input,select,textarea{width:100%;padding:10px;border:1px solid #cdd8e8;border-radius:8px;font:inherit;background:#fff}input[type=checkbox]{width:auto}textarea{min-height:90px}
.row{display:grid;gap:0 12px}@media(min-width:700px){.row{grid-template-columns:1fr 1fr}}.thumb{width:70px;height:70px;object-fit:cover;border-radius:8px}.ims{display:flex;flex-wrap:wrap;gap:8px}.ims div{text-align:center}.ims button{padding:4px 7px}
table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:8px;border-bottom:1px solid #e3e9f2;text-align:left;font-size:.9rem}.tw{overflow-x:auto}.bar{background:var(--c2);height:12px;border-radius:6px}.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.kpi div{background:#fff;border-radius:12px;padding:12px}.kpi b{font-size:1.6rem;color:var(--c1);display:block}

.nfw{display:grid;gap:16px}@media(min-width:900px){.nfw{grid-template-columns:1fr 300px}}
.phone{width:270px;margin:auto;background:#111;border-radius:36px;padding:12px;box-shadow:0 6px 20px #0004}.pscr{background:linear-gradient(160deg,#1e3a8a,#6b21a8 60%,#be185d);border-radius:26px;min-height:440px;padding:14px 10px}.ptime{color:#fff;text-align:center;font-size:2.6rem;font-weight:300;margin:14px 0 18px}
.pn{background:#ffffffe6;border-radius:16px;padding:10px 12px;color:#111;font-size:.85rem}.pnh{display:flex;align-items:center;gap:6px;font-size:.72rem;color:#555;margin-bottom:4px}.pnh img{width:18px;height:18px;border-radius:4px}.pnh small{margin-left:auto}.pn b{display:block;word-break:break-word}.pn p{margin:2px 0 0;white-space:pre-line;word-break:break-word}.pn #pvi{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-top:8px}
</style></head>
<body><div id=app class=w></div>
<script type=module>
import {sb,$,esc,money,priceTxt,CONFIGURED,THEMES,themeOn,contactCfg,CTYPES,CGROUPS,CBLOCKS,cIcon,cHref,pushSubscribe,currentSub} from '../js/app.js';
const A=$('#app');const W=window;
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Math.random().toString(36).slice(2,6);
const num=v=>{if(v===''||v==null)return null;let s=String(v).replace(/[^\d.,]/g,'');if(!s)return NaN;if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else if(/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}return Number(s)};
const run=async f=>{try{return await f()}catch(e){if(e)alert('Erro: '+(e.message||e));console.error(e)}};
// reduz fotos grandes antes de enviar (máx. 1600px, WebP/JPEG) para o site carregar mais rápido
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
async function shrink(file,max=1600){if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
 try{const bm=await createImageBitmap(file),k=Math.min(1,max/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);bm.close?.();
  let b=await toBlob(c,'image/webp',.82);if(!b||b.type!=='image/webp')b=file.type==='image/png'?await toBlob(c,'image/png'):await toBlob(c,'image/jpeg',.82);
  return b&&b.size<file.size?new File([b],'x.'+b.type.split('/')[1].replace('jpeg','jpg'),{type:b.type}):file}catch(e){return file}}
async function up(file){const vid=file.type.startsWith('video/');
 if(!file.type.startsWith('image/')&&!vid)throw new Error('Envie apenas imagem ou vídeo (mp4/webm).');
 if(!vid)file=await shrink(file);
 if(file.size>(vid?50:5)*1048576)throw new Error(vid?'Vídeo acima de 50 MB. Use um link do YouTube.':'Imagem acima de 5 MB.');
 const p=`${vid?'v':'i'}/${crypto.randomUUID()}.${file.name.split('.').pop().toLowerCase()}`;
 const {error}=await sb.storage.from('compras-rapidas').upload(p,file);if(error)throw error;return sb.storage.from('compras-rapidas').getPublicUrl(p).data.publicUrl}
const out=()=>`<button class="btn alt sm" onclick="lo()">Sair</button>`;W.lo=async()=>{await sb.auth.signOut({scope:'local'});init()};
async function init(){if(!CONFIGURED){A.innerHTML='<div class=box><h2>Não configurado</h2><p>Preencha o arquivo config.js com a URL e a chave pública do Supabase (Guia, Parte 3).</p></div>';return}
 const {data:{session}}=await sb.auth.getSession();if(!session)return login();
 const {data}=await sb.from('cr_admins').select('user_id').eq('user_id',session.user.id);
 if(!data?.length){const {data:ok}=await sb.rpc('cr_claim_admin');if(ok)return init()}
 if(!data?.length){A.innerHTML='<div class=box><h2>Sem permissão</h2><p>Este usuário não está na lista de administradores (veja o Guia, passo do administrador).</p>'+out()+'</div>';return}
 const T={Painel:dash,Produtos:prods,Categorias:cats,Banners:bans,Início:home,Carrossel:carr,Temas:temas,Contato:contato,Aparência:look,Estatísticas:stats,Notificações:notif,Importar:imp,Backup:backup};
 A.innerHTML=`<div class=ad>${Object.keys(T).map(k=>`<button data-t="${k}">${k}</button>`).join('')}<button onclick="lo()">Sair</button></div><div id=main></div>`;
 A.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{A.querySelectorAll('.ad button').forEach(x=>x.classList.remove('on'));b.classList.add('on');run(()=>T[b.dataset.t]($('#main')))});
 A.querySelector('[data-t]').click()}
function login(){A.innerHTML=`<div class=box style="max-width:380px;margin:40px auto"><h2>Painel Compras Rápidas</h2><label>E-mail<input id=e type=email autocomplete=username></label><label>Senha<input id=s type=password autocomplete=current-password></label><button class="btn big" id=ok>Entrar</button></div>`;
 $('#ok').onclick=()=>run(async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#e').value,password:$('#s').value});if(error)throw new Error('E-mail ou senha incorretos.');init()})}
// ---------- Painel
async function clicks(d){const {data}=await sb.from('cr_click_events').select('product_id,created_at,products:cr_products(name),categories:cr_categories(name),merchants:cr_merchants(name)').gte('created_at',new Date(Date.now()-d*864e5).toISOString()).limit(10000);return data||[]}
const cnt=(t,f)=>{let q=sb.from(t).select('*',{count:'exact',head:true});return(f?f(q):q).then(r=>r.count??0)};
async function dash(el){const now=new Date().toISOString();
 const [a,b,c,d,e,f,g,ck]=await Promise.all([cnt('cr_products'),cnt('cr_products',q=>q.eq('status','active')),cnt('cr_products',q=>q.eq('status','archived')),cnt('cr_categories'),cnt('cr_products',q=>q.eq('featured',true).eq('status','active')),cnt('cr_products',q=>q.eq('offer',true).eq('status','active')),cnt('cr_click_events'),clicks(30)]);
 const top={};ck.forEach(x=>{const n=x.products?.name||'(removido)';top[n]=(top[n]||0)+1});
 el.innerHTML=await bkNote()+`<h2>Painel</h2><div class=kpi>${[['Produtos',a],['Ativos',b],['Arquivados',c],['Categorias',d],['Em destaque',e],['Em oferta',f],['Cliques (total)',g]].map(([k,v])=>`<div><b>${v}</b>${k}</div>`).join('')}</div>
 <div class=box><h3>Mais acessados (30 dias)</h3>${Object.entries(top).sort((x,y)=>y[1]-x[1]).slice(0,5).map(([n,v])=>`<p>${esc(n)} — <b>${v}</b></p>`).join('')||'<p>Sem cliques ainda.</p>'}<p class=note>Cliques não representam vendas. Confira vendas e comissões nos painéis oficiais dos programas de afiliados.</p></div>`}
// ---------- Produtos
// produtos no banner do topo ficam em cr_site_settings.data.banner_ids
const BMAX=10;
const getSet=async()=>(await sb.from('cr_site_settings').select('data').eq('id',1).maybeSingle()).data?.data||{};
async function setBanner(pid,on){const cur=await getSet();let ids=(cur.banner_ids||[]).filter(i=>i!==pid);if(on)ids.push(pid);
 const {error}=await sb.from('cr_site_settings').upsert({id:1,data:{...cur,banner_ids:ids}});if(error)throw error}
let PF={};const PP=50;
async function prods(el,f=PF){
 f={term:'',st:'',cat:'',pg:0,...f};PF=f;const {term,st,cat}=f;
 const mk=(c,pg)=>{let q=sb.from('cr_products').select(`id,name,price,${c?'price_max,':''}status,featured,offer,categories:cr_categories(name),merchants:cr_merchants(name)`,{count:'exact'}).order('name',{ascending:true}).order('id',{ascending:true}).range(pg*PP,pg*PP+PP-1);
 if(term)q=q.ilike('name',`%${term.replace(/[%,]/g,' ')}%`);if(st)q=q.eq('status',st);if(cat==='none')q=q.is('category_id',null);else if(cat)q=q.eq('category_id',cat);return q};
 const [{data:cs},cfg]=await Promise.all([sb.from('cr_categories').select('id,name').order('name'),getSet()]);
 const load=async pg=>{let r=await mk(1,pg);if(r.error&&/price_max/.test(r.error.message||''))r=await mk(0,pg);if(r.error)throw r.error;return r};
 let r=f.pg?await load(f.pg).catch(()=>null):await load(0);if(!r){r=await load(0);f.pg=1e9}
 let total=r.count||0,pages=Math.max(1,Math.ceil(total/PP));
 if(f.pg>=pages){f.pg=pages-1;if(f.pg)r=await load(f.pg)}
 const data=r.data||[],BI=new Set(cfg.banner_ids||[]),pg=f.pg,ini=total?pg*PP+1:0,fim=pg*PP+data.length;
 const nav=`<div class=pgn><button class="btn alt sm" data-p=0 ${pg?'':'disabled'}>«</button><button class="btn alt sm" data-p=${pg-1} ${pg?'':'disabled'}>‹ Anterior</button><span>Página ${pg+1} de ${pages} · ${ini}–${fim} de ${total}</span><button class="btn alt sm" data-p=${pg+1} ${pg<pages-1?'':'disabled'}>Próxima ›</button><button class="btn alt sm" data-p=${pages-1} ${pg<pages-1?'':'disabled'}>»</button></div>`;
 el.innerHTML=`<h2>Produtos</h2><div class=box><div class=row><label>Buscar<input id=pt value="${esc(term)}"></label><label>Status<select id=ps><option value="">Todos</option><option value=active>Ativos</option><option value=inactive>Inativos</option><option value=archived>Arquivados</option></select></label><label>Categoria<select id=pc><option value="">Todas</option>${(cs||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}<option value=none>Sem categoria</option></select></label></div><button class="btn sm" id=pb>Filtrar</button> <button class="btn alt sm" id=px>Limpar</button> <button class="btn sm" id=pn>+ Novo produto</button><p class=note>⭐ destaque · 🏷️ oferta · 🖼️ no banner do topo</p></div>
 ${nav}<div class=tw><table><tr><th>Produto<th>Preço<th>Categoria<th>Status<th></tr>${data.length?data.map(p=>`<tr><td>${esc(p.name)} ${p.featured?'⭐':''}${p.offer?'🏷️':''}${BI.has(p.id)?'<span title="No banner do topo">🖼️</span>':''}<td>${priceTxt(p)}<td>${esc(p.categories?.name||'')}<td>${p.status}<td><button class="btn sm" data-e="${p.id}">Editar</button><button class="btn alt sm" data-a="${p.id}" data-s="${p.status}">${p.status==='archived'?'Reativar':'Arquivar'}</button><button class="btn alt sm" data-d="${p.id}">Excluir</button></tr>`).join(''):'<tr><td colspan=5>Nenhum produto encontrado.</tr>'}</table></div>${pages>1?nav:''}`;
 $('#ps').value=st;$('#pc').value=cat;
 const go=()=>run(()=>prods(el,{term:$('#pt').value.trim(),st:$('#ps').value,cat:$('#pc').value,pg:0}));
 $('#pb').onclick=go;$('#pt').onkeydown=e=>{if(e.key==='Enter')go()};$('#ps').onchange=go;$('#pc').onchange=go;
 $('#px').onclick=()=>run(()=>prods(el,{}));$('#pn').onclick=()=>run(()=>pform(el));
 el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>run(async()=>{await prods(el,{...f,pg:+b.dataset.p});el.scrollIntoView?.({block:'start'})}));
 el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>run(()=>pform(el,b.dataset.e)));
 el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>run(async()=>{await sb.from('cr_products').update({status:b.dataset.s==='archived'?'active':'archived'}).eq('id',b.dataset.a);await prods(el,f)}));
 el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>run(async()=>{if(!confirm('Excluir este produto definitivamente?'))return;const {error}=await sb.from('cr_products').delete().eq('id',b.dataset.d);if(error)throw error;await prods(el,f)}))}
async function pform(el,id){
 const [{data:cs},{data:ms},cfg]=await Promise.all([sb.from('cr_categories').select('id,name').order('sort'),sb.from('cr_merchants').select('name'),getSet()]);const bids=cfg.banner_ids||[],inB=!!id&&bids.includes(id);
 let p={status:'active'},imgs=[],vids=['','',''];
 if(id){({data:p}=await sb.from('cr_products').select('*,merchants:cr_merchants(name),product_images:cr_product_images(url,sort),product_videos:cr_product_videos(url,sort)').eq('id',id).single());
  imgs=[...p.product_images].sort((a,b)=>a.sort-b.sort).map(i=>({url:i.url}));[...p.product_videos].sort((a,b)=>a.sort-b.sort).forEach((v,i)=>vids[i]=v.url)}
 const dt=v=>v?new Date(v).toISOString().slice(0,16):'';
 el.innerHTML=`<h2>${id?'Editar':'Novo'} produto</h2><div class=box><label>Nome*<input id=n value="${esc(p.name||'')}"></label><label>Descrição<textarea id=d>${esc(p.description||'')}</textarea></label>
 <div class=row><label>Preço atual (R$) — ou o menor preço<input id=pr inputmode=decimal value="${p.price??''}"></label><label>Até (preço máximo, R$) — opcional<input id=pm inputmode=decimal value="${p.price_max??''}" placeholder="Ex.: 25,90"><small class=note>Para produtos com variações (ex.: Shopee). Aparece como “R$ 14,50 – R$ 25,90”. Deixe vazio para preço único.</small></label>
 <label>Preço anterior (R$)<input id=po inputmode=decimal value="${p.old_price??''}"></label><span></span>
 <label>Categoria*<select id=c><option value="">Escolha…</option>${(cs||[]).map(c=>`<option value=${c.id} ${c.id===p.category_id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
 <label>Loja parceira*<input id=m list=ml value="${esc(p.merchants?.name||'')}" placeholder="Shopee, Mercado Livre…"><datalist id=ml>${(ms||[]).map(m=>`<option>${esc(m.name)}`).join('')}</datalist></label></div>
 <label>Link de afiliado* (https://…)<input id=u value="${esc(p.affiliate_url||'')}"></label>
 <div class=row><label><input type=checkbox id=f ${p.featured?'checked':''}> Produto em destaque</label><label><input type=checkbox id=o ${p.offer?'checked':''}> Produto em oferta</label><label><input type=checkbox id=bnr ${inB?'checked':''}> 🖼️ Mostrar no banner do topo da página inicial</label><p class=note>Aparece como um slide do banner grande, com a foto, o nome, o preço e o botão “Ver produto”. Só aparece se o produto estiver ativo.</p>
 <label>Início da oferta<input type=datetime-local id=os value="${dt(p.offer_start)}"></label><label>Fim da oferta<input type=datetime-local id=oe value="${dt(p.offer_end)}"></label>
 <label>Status<select id=st><option value=active>Ativo</option><option value=inactive>Inativo</option><option value=archived>Arquivado</option></select></label></div></div>
 <div class=box><h3>Fotos (até 10) — a primeira é a capa</h3><div class=ims id=im></div><label>Adicionar fotos<input type=file id=fi accept="image/*" multiple></label></div>
 <div class=box><h3>Vídeos (até 3)</h3>${[0,1,2].map(i=>`<label>Vídeo ${i+1}: link (YouTube/Vimeo) ou envie arquivo<input data-v=${i} value="${esc(vids[i])}"><input type=file data-vf=${i} accept="video/mp4,video/webm"></label>`).join('')}</div>
 <button class=btn id=sv>Salvar produto</button> <button class="btn alt" id=cn>Cancelar</button>`;
 $('#st').value=p.status;
 const draw=()=>{$('#im').innerHTML=imgs.map((x,i)=>`<div><img class=thumb src="${esc(x.url)}"><br><button class="btn alt sm" data-m="${i}:-1">◀</button><button class="btn alt sm" data-m="${i}:1">▶</button><button class="btn alt sm" data-m="${i}:c">★</button><button class="btn alt sm" data-m="${i}:x">✕</button></div>`).join('')||'<p class=note>Nenhuma foto.</p>';
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const [i,a]=b.dataset.m.split(':');const k=+i;
   if(a==='x')imgs.splice(k,1);else if(a==='c')imgs.unshift(...imgs.splice(k,1));else{const j=k+ +a;if(j>=0&&j<imgs.length)[imgs[k],imgs[j]]=[imgs[j],imgs[k]]}draw()})};draw();
 $('#fi').onchange=e=>{[...e.target.files].forEach(f=>{if(imgs.length<10)imgs.push({url:URL.createObjectURL(f),file:f})});e.target.value='';draw()};
 el.querySelectorAll('[data-vf]').forEach(i=>i.onchange=()=>run(async()=>{const f=i.files[0];if(f)el.querySelector(`[data-v="${i.dataset.vf}"]`).value=await up(f)}));
 $('#cn').onclick=()=>prods(el);
 $('#sv').onclick=()=>run(async()=>{
  const name=$('#n').value.trim(),url=$('#u').value.trim(),mn=$('#m').value.trim(),pr=num($('#pr').value),po=num($('#po').value),pm=num($('#pm').value);
  if(!name||!$('#c').value||!mn)throw new Error('Preencha nome, categoria e loja.');if(!/^https?:\/\//i.test(url))throw new Error('O link de afiliado deve começar com https://');
  if(pr!=null&&isNaN(pr)||po!=null&&isNaN(po)||pm!=null&&isNaN(pm))throw new Error('Preço atual, anterior ou máximo inválido. Use só números, por exemplo 23,49.');
  if(pm!=null&&(pr==null||pm<=pr))throw new Error('O preço máximo precisa ser maior que o preço atual (ex.: de 14,50 até 25,90). Deixe vazio se o preço for único.');if(po!=null&&pr!=null&&po<=pr&&!confirm('Preço anterior não é maior que o atual; o desconto não será exibido. Continuar?'))return;
  const wantB=$('#bnr').checked;if(wantB&&!inB&&bids.length>=BMAX)throw new Error('O banner do topo já tem '+BMAX+' produtos. Desmarque algum antes (aba Banners).');
  $('#sv').disabled=true;$('#sv').textContent='Salvando…';
  let {data:m}=await sb.from('cr_merchants').select('id').ilike('name',mn).maybeSingle();if(!m){const r=await sb.from('cr_merchants').insert({name:mn}).select('id').single();if(r.error)throw r.error;m=r.data}
  const row={name,description:$('#d').value,price:pr,old_price:po,category_id:$('#c').value,merchant_id:m.id,affiliate_url:url,featured:$('#f').checked,offer:$('#o').checked,
   offer_start:$('#os').value?new Date($('#os').value).toISOString():null,offer_end:$('#oe').value?new Date($('#oe').value).toISOString():null,status:$('#st').value};if(pm!=null||p.price_max!=null)row.price_max=pm;
  const nomax=e=>e&&/price_max/.test(e.message||'')?new Error('Para usar o preço máximo, rode antes o arquivo supabase/02-preco-maximo.sql no Supabase (SQL Editor). Ou deixe o preço máximo vazio.'):e;
  let pid=id;if(id){const {error}=await sb.from('cr_products').update(row).eq('id',id);if(error)throw nomax(error)}else{const r=await sb.from('cr_products').insert({...row,slug:slug(name)}).select('id').single();if(r.error)throw nomax(r.error);pid=r.data.id}
  for(const x of imgs)if(x.file){x.url=await up(x.file);delete x.file}
  await sb.from('cr_product_images').delete().eq('product_id',pid);if(imgs.length)await sb.from('cr_product_images').insert(imgs.map((x,i)=>({product_id:pid,url:x.url,sort:i,is_cover:i===0})));
  const vs=[...el.querySelectorAll('[data-v]')].map(i=>i.value.trim()).filter(Boolean);if(vs.some(v=>!/^https?:\/\//i.test(v)))throw new Error('Link de vídeo inválido.');
  await sb.from('cr_product_videos').delete().eq('product_id',pid);if(vs.length)await sb.from('cr_product_videos').insert(vs.map((url,i)=>({product_id:pid,url,sort:i})));
  if(wantB!==inB)await setBanner(pid,wantB);
  alert('Produto salvo!'+(wantB&&$('#st').value!=='active'?' Atenção: o produto não está ativo, então não aparece no banner.':''));prods(el)})}
// ---------- Editor genérico (categorias, banners, seções)
async function editor(el,table,fields,o={}){const pk=o.pk||'id';const {data:rows}=await sb.from(table).select('*').order(o.order||'sort');
 const fld=(k,l,t,v)=>t==='bool'?`<label><input type=checkbox data-k=${k} ${v?'checked':''}> ${l}</label>`:t==='img'?`<label>${l}<img class=thumb src="${esc(v||'')}" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'"><input type=file accept="image/*" data-f=${k}></label><input type=hidden data-k=${k} value="${esc(v||'')}">`:`<label>${l}<input data-k=${k} data-t=${t} ${t==='num'?'type=number':''} value="${esc(v??'')}"></label>`;
 const rowH=r=>`<div class=box data-id="${r?r[pk]:''}"><div class=row>${fields.map(([k,l,t])=>fld(k,l,t,r?.[k])).join('')}</div><button class="btn sm" data-save>Salvar</button>${o.noDel?'':'<button class="btn alt sm" data-del>Excluir</button>'}</div>`;
 el.innerHTML=(o.head||'')+(rows||[]).map(rowH).join('')+(o.noNew?'':`<h3>Novo</h3>${rowH(null)}`);
 el.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>run(async()=>{const u=await up(i.files[0]);const h=i.closest('label').nextElementSibling;h.value=u;i.closest('label').querySelector('img').src=u}));
 el.querySelectorAll('.box[data-id]').forEach(b=>{const id=b.dataset.id;
  b.querySelector('[data-save]').onclick=()=>run(async()=>{const row={};b.querySelectorAll('[data-k]').forEach(i=>{const k=i.dataset.k;row[k]=i.type==='checkbox'?i.checked:i.dataset.t==='num'||i.type==='number'?num(i.value)||0:(i.value||null)});
   if(o.req&&!row[o.req])throw new Error('Preencha o campo obrigatório.');let r;if(id)r=await sb.from(table).update(row).eq(pk,id);else{if(o.pre)o.pre(row);r=await sb.from(table).insert(row)}if(r.error)throw r.error;editor(el,table,fields,o)});
  const d=b.querySelector('[data-del]');if(d)d.onclick=()=>run(async()=>{if(!id){return}if(!confirm('Excluir?'))return;const r=await sb.from(table).delete().eq(pk,id);if(r.error)throw new Error(r.error.code==='23503'?'Existem produtos nesta categoria. Mova ou remova-os antes.':r.error.message);editor(el,table,fields,o)})});o.after?.()}
const cats=el=>editor(el,'cr_categories',[['name','Nome','text'],['image_url','Imagem','img'],['sort','Ordem','num'],['active','Ativa','bool']],{req:'name',head:'<h2>Categorias</h2>',pre:r=>r.slug=slug(r.name)});
async function bans(el){const cfg=await getSet(),ids=cfg.banner_ids||[];let P={};
 if(ids.length){const {data}=await sb.from('cr_products').select('id,name,price,status').in('id',ids);P=Object.fromEntries((data||[]).map(p=>[p.id,p]))}
 const L=ids.filter(i=>P[i]);
 const top=`<h2>Banners</h2><div class=box><h3>🖼️ Produtos no banner do topo</h3><p class=note>Para colocar um produto aqui, abra o cadastro dele (aba Produtos) e marque “Mostrar no banner do topo”. Eles aparecem depois dos banners comuns, nesta ordem.</p>${L.map((i,k)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid #e3e9f2;padding:6px 0"><span>${esc(P[i].name)} <small class=note>${P[i].price!=null?money(P[i].price):''}${P[i].status!=='active'?' · não aparece (produto '+P[i].status+')':''}</small></span><span><button class="btn alt sm" data-bu="${k}">▲</button><button class="btn alt sm" data-bd="${k}">▼</button><button class="btn alt sm" data-bx="${k}">Tirar</button></span></div>`).join('')||'<p>Nenhum produto no banner.</p>'}</div><h3>Banners comuns</h3>`;
 const wire=()=>el.querySelectorAll('[data-bu],[data-bd],[data-bx]').forEach(b=>b.onclick=()=>run(async()=>{const d=b.dataset,a=[...L];
  if(d.bx!==undefined)a.splice(+d.bx,1);else{const k=+(d.bu??d.bd),j=d.bu!==undefined?k-1:k+1;if(j<0||j>=a.length)return;[a[k],a[j]]=[a[j],a[k]]}
  const cur=await getSet();const {error}=await sb.from('cr_site_settings').upsert({id:1,data:{...cur,banner_ids:a}});if(error)throw error;bans(el)}));
 await bansEd(el,top,wire)}
const bansEd=(el,top,wire)=>editor(el,'cr_banners',[['title','Título','text'],['subtitle','Subtítulo','text'],['image_url','Imagem','img'],['button_text','Texto do botão','text'],['button_url','Link do botão','text'],['sort','Ordem','num'],['active','Ativo','bool']],{after:wire,head:top+'<p class=note>Os banners ativos passam no topo da página inicial, do menor para o maior número de “Ordem”.</p>'});
const home=el=>editor(el,'cr_homepage_sections',[['title','Título da seção','text'],['qty','Quantidade exibida','num'],['sort','Ordem','num'],['visible','Visível','bool']],{pk:'key',noNew:true,noDel:true,head:'<h2>Página inicial</h2><p class=note>Seções: ofertas, destaques, novidades e categorias. A oferta/destaque de cada produto é definida no cadastro do produto.</p>'});

 const F=[['name','Nome da loja','text'],['slogan','Slogan','text'],['c1','Cor principal','color'],['c2','Cor secundária','color'],['btn','Cor dos botões','color'],['logo','Logotipo','img'],['favicon','Favicon','img'],['footer_text','Texto do rodapé','text'],['seo_title','Título do site (SEO)','text'],['seo_desc','Descrição do site (SEO)','text'],['per_page','Produtos por página (lista/busca)','num'],['about','Texto "Sobre a loja"','area'],['privacy','Política de privacidade','area']];

 const v={...s};const ap=()=>{const r=document.documentElement.style;r.setProperty('--c1',$('[data-k=c1]').value);r.setProperty('--c2',$('[data-k=c2]').value);r.setProperty('--btn',$('[data-k=btn]').value)};
 el.querySelectorAll('input[type=color]').forEach(i=>i.oninput=ap);

// ---------- Gerenciar página de contato (salva em cr_site_settings.data.contact)
async function contato(el){
 const s0=(await sb.from('cr_site_settings').select('data').eq('id',1).maybeSingle()).data?.data||{};
 const C=JSON.parse(JSON.stringify(contactCfg(s0)));const saved=!!s0.contact;
 C.blocks=C.blocks.filter(b=>CBLOCKS[b.k]);Object.keys(CBLOCKS).forEach(k=>{if(!C.blocks.some(b=>b.k===k))C.blocks.push({k,on:true})});
 const opts=sel=>Object.entries(CTYPES).map(([k,t])=>`<option value=${k} ${k===sel?'selected':''}>${esc(t.n)}${t.n===CGROUPS[t.g]?'':' ('+esc(CGROUPS[t.g])+')'}</option>`).join('');
 const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return false;[a[i],a[j]]=[a[j],a[i]];return true};
 const pic=(k,l)=>`<div class=box><b>${l}</b><div style="display:flex;gap:10px;align-items:center;margin-top:6px"><img class=thumb data-ci=${k} src="${esc(C[k]||'')}" style="${C[k]?'':'visibility:hidden'}"><span><input type=file accept="image/*" data-cf=${k}><button class="btn alt sm" data-cr=${k}>Remover imagem</button></span></div></div>`;
 const link=it=>{const h=cHref(it);return (it.value||'').trim()?h?`<small class=note>Abre: ${esc(h)}</small>`:'<small class=note style="color:#e5384f">⚠ Endereço inválido: este item não terá link.</small>':''};
 const draw=()=>{
  el.innerHTML=`<h2>Gerenciar página de contato</h2>${saved?'':'<p class=note style="color:#b45309"><b>Ainda não salvo.</b> Preenchemos com os dados que o site já tinha (telefone, e-mail, Instagram, Facebook). Revise e clique em Salvar.</p>'}
  <div class=box><h3>Apresentação</h3><div class=row><label>Título da página<input data-k=title value="${esc(C.title||'')}" placeholder="Fale com a gente"></label><label>Nome da loja exibido<input data-k=store_name value="${esc(C.store_name||'')}" placeholder="Em branco = nome da loja (Aparência)"></label></div>
  <label>Apresentação (texto abaixo do título)<textarea data-k=subtitle>${esc(C.subtitle||'')}</textarea></label>
  <label>Descrição institucional (bloco “Sobre a loja”)<textarea data-k=about>${esc(C.about||'')}</textarea></label>
  <label>Horário de atendimento<textarea data-k=hours placeholder="Segunda a sexta, das 9h às 18h">${esc(C.hours||'')}</textarea></label></div>
  <div class=row>${pic('logo','Logotipo da página (em branco = logotipo da loja)')}${pic('cover','Imagem de capa (fundo do topo)')}</div>
  <label><input type=checkbox data-b=show_logo ${C.show_logo!==false?'checked':''}> Mostrar logotipo no topo da página</label>
  <div class=box><h3>Seções da página (ordem e visibilidade)</h3>${C.blocks.map((b,i)=>`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid #e3e9f2;padding:6px 0"><label style="margin:0"><input type=checkbox data-bo=${i} ${b.on!==false?'checked':''}> Mostrar</label><input data-bt=${i} value="${esc(b.t||'')}" placeholder="${esc(CBLOCKS[b.k])}" style="flex:1;min-width:160px"><span><button class="btn alt sm" data-bm="${i}:-1">▲</button><button class="btn alt sm" data-bm="${i}:1">▼</button></span></div>`).join('')}<p class=note>Cada contato aparece na seção do seu tipo: Atendimento, Redes sociais ou Outro site.</p></div>
  <div class=box><h3>Contatos, redes sociais e links</h3>${C.items.map((it,i)=>`<div style="border-top:1px solid #e3e9f2;padding:10px 0;${it.on===false?'opacity:.55':''}"><div style="display:flex;gap:10px;align-items:flex-start"><span data-ip=${i}>${cIcon(it,40)}</span><div style="flex:1;min-width:0"><div class=row><label>Tipo e ícone<select data-it=${i}>${opts(it.type)}</select></label><label>Nome exibido<input data-il=${i} value="${esc(it.label||'')}" placeholder="${esc((CTYPES[it.type]||CTYPES.site).n)}"></label></div>
   <label>Número, e-mail, @usuário ou endereço (link)<input data-iv=${i} value="${esc(it.value||'')}" placeholder="${esc((CTYPES[it.type]||CTYPES.site).ph)}"></label><div data-ih=${i}>${link(it)}</div>
   ${it.type==='whatsapp'?`<label>Mensagem inicial (opcional)<input data-im=${i} value="${esc(it.msg||'')}" placeholder="Olá! Vim pelo site."></label>`:''}
   <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><label style="margin:0"><input type=checkbox data-io=${i} ${it.on!==false?'checked':''}> Ativo</label><button class="btn alt sm" data-mv="${i}:-1">▲</button><button class="btn alt sm" data-mv="${i}:1">▼</button><button class="btn alt sm" data-rm=${i}>✕ Remover</button>
   <label class="btn alt sm" style="margin:2px;display:inline-block">Ícone próprio…<input type=file accept="image/*" data-iu=${i} style="display:none"></label>${it.icon?`<button class="btn alt sm" data-ix=${i}>Usar ícone padrão</button>`:''}</div></div></div></div>`).join('')||'<p class=note>Nenhum item ainda.</p>'}
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px"><select id=nt style="width:auto;flex:1;min-width:200px">${opts('whatsapp')}</select><button class="btn sm" id=na>+ Adicionar</button></div></div>
  <button class=btn id=csv>Salvar</button> <button class="btn alt" id=cvw>Salvar e ver a página</button>`;
  el.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>C[i.dataset.k]=i.value);
  el.querySelectorAll('[data-b]').forEach(i=>i.onchange=()=>C[i.dataset.b]=i.checked);
  el.querySelectorAll('[data-bo]').forEach(i=>i.onchange=()=>C.blocks[+i.dataset.bo].on=i.checked);
  el.querySelectorAll('[data-bt]').forEach(i=>i.oninput=()=>C.blocks[+i.dataset.bt].t=i.value.trim());
  el.querySelectorAll('[data-bm]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.bm.split(':');if(mv(C.blocks,+i,+d))draw()});
  el.querySelectorAll('[data-cf]').forEach(i=>i.onchange=()=>run(async()=>{const k=i.dataset.cf;C[k]=await up(i.files[0]);draw()}));
  el.querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>{C[b.dataset.cr]='';draw()});
  el.querySelectorAll('[data-it]').forEach(i=>i.onchange=()=>{C.items[+i.dataset.it].type=i.value;draw()});
  el.querySelectorAll('[data-il]').forEach(i=>i.oninput=()=>C.items[+i.dataset.il].label=i.value);
  el.querySelectorAll('[data-iv]').forEach(i=>i.oninput=()=>{const n=+i.dataset.iv;C.items[n].value=i.value;el.querySelector(`[data-ih="${n}"]`).innerHTML=link(C.items[n])});
  el.querySelectorAll('[data-im]').forEach(i=>i.oninput=()=>C.items[+i.dataset.im].msg=i.value);
  el.querySelectorAll('[data-io]').forEach(i=>i.onchange=()=>{C.items[+i.dataset.io].on=i.checked;draw()});
  el.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.mv.split(':');if(mv(C.items,+i,+d))draw()});
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{if(confirm('Remover este item?')){C.items.splice(+b.dataset.rm,1);draw()}});
  el.querySelectorAll('[data-iu]').forEach(i=>i.onchange=()=>run(async()=>{C.items[+i.dataset.iu].icon=await up(i.files[0]);draw()}));
  el.querySelectorAll('[data-ix]').forEach(b=>b.onclick=()=>{delete C.items[+b.dataset.ix].icon;draw()});
  $('#na').onclick=()=>{const t=$('#nt').value;C.items.push({type:t,label:CTYPES[t].n,value:'',on:true});draw();el.querySelector(`[data-iv="${C.items.length-1}"]`).focus()};
  const save=async()=>{C.items=C.items.map(it=>({...it,label:(it.label||'').trim(),value:(it.value||'').trim()}));
   const {data:cur}=await sb.from('cr_site_settings').select('data').eq('id',1).maybeSingle();
   const {error}=await sb.from('cr_site_settings').upsert({id:1,data:{...(cur?.data||{}),contact:C}});if(error)throw error};
  $('#csv').onclick=()=>run(async()=>{await save();alert('Página de contato salva!');contato(el)});
  $('#cvw').onclick=()=>{const w=window.open('about:blank','_blank');run(async()=>{try{await save()}catch(e){w?.close();throw e}if(w)w.location.href='../contato.html';else location.href='../contato.html';contato(el)})}};
 draw()}
// ---------- Estatísticas
async function stats(el,d=30){const ck=await clicks(d);const g=f=>{const o={};ck.forEach(x=>{const k=f(x)||'(sem dado)';o[k]=(o[k]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,10)};
 const bl=(t,a)=>{const mx=a[0]?.[1]||1;return `<div class=box><h3>${t}</h3>${a.map(([k,v])=>`<p>${esc(k)} — <b>${v}</b><div class=bar style="width:${v/mx*100}%"></div></p>`).join('')||'<p>Sem dados.</p>'}</div>`};
 el.innerHTML=`<h2>Estatísticas</h2><label>Período<select id=d><option value=7>7 dias</option><option value=30>30 dias</option><option value=90>90 dias</option></select></label><p class=note>Total de cliques no período: <b>${ck.length}</b>. Cliques não são vendas nem comissões confirmadas — consulte os painéis oficiais dos programas de afiliados.</p>${bl('Cliques por produto',g(x=>x.products?.name))}${bl('Cliques por categoria',g(x=>x.categories?.name))}${bl('Cliques por loja parceira',g(x=>x.merchants?.name))}`;
 $('#d').value=d;$('#d').onchange=e=>stats(el,+e.target.value)}
// ---------- Importar CSV
function csv(t){const d=t.split('\n')[0].includes(';')?';':',';const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==d){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=h}if(c||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(v=>v.trim()))}
async function imp(el){el.innerHTML=`<h2>Importar produtos (CSV)</h2><div class=box><p>Use o arquivo <b>modelo-importacao.csv</b> (abra no Excel/Planilhas e salve como CSV). Colunas: nome, descricao, preco, preco_anterior, categoria, loja, link, destaque, oferta, imagem_url e, opcional, preco_maximo (para faixa de preço, ex.: Shopee). Categorias e lojas inexistentes são criadas.</p><input type=file id=cf accept=".csv,text/csv"></div><div id=pv></div>`;
 $('#cf').onchange=async e=>{const rows=csv((await e.target.files[0].text()).replace(/^\uFEFF/,'')),h=rows.shift().map(x=>x.trim().toLowerCase());const L=rows.map((r,n)=>{const o={};h.forEach((k,i)=>o[k]=(r[i]||'').trim());o.err=!o.nome?'sem nome':!o.categoria?'sem categoria':!o.loja?'sem loja':!/^https?:\/\//i.test(o.link)?'link inválido':isNaN(num(o.preco)||0)?'preço inválido':o.preco_maximo&&(isNaN(num(o.preco_maximo))||!(num(o.preco_maximo)>num(o.preco)))?'preço máximo inválido (precisa ser maior que o preço)':'';return o});
  $('#pv').innerHTML=`<div class=tw><table><tr><th>Nome<th>Preço<th>Categoria<th>Loja<th>Situação</tr>${L.map(o=>`<tr><td>${esc(o.nome)}<td>${esc(o.preco)}${o.preco_maximo?' – '+esc(o.preco_maximo):''}<td>${esc(o.categoria)}<td>${esc(o.loja)}<td>${o.err?'❌ '+o.err:'✅ ok'}</tr>`).join('')}</table></div><button class=btn id=go>Importar ${L.filter(o=>!o.err).length} produto(s) válidos</button>`;
  $('#go').onclick=()=>run(async()=>{let n=0;const C={},M={};const sim=v=>/^(sim|s|1|true)$/i.test(v||'');
   for(const o of L.filter(o=>!o.err)){if(!C[o.categoria]){let {data:c}=await sb.from('cr_categories').select('id').ilike('name',o.categoria).maybeSingle();if(!c)c=(await sb.from('cr_categories').insert({name:o.categoria,slug:slug(o.categoria)}).select('id').single()).data;C[o.categoria]=c.id}
    if(!M[o.loja]){let {data:m}=await sb.from('cr_merchants').select('id').ilike('name',o.loja).maybeSingle();if(!m)m=(await sb.from('cr_merchants').insert({name:o.loja}).select('id').single()).data;M[o.loja]=m.id}
    const {data:p,error}=await sb.from('cr_products').insert({name:o.nome,slug:slug(o.nome),description:o.descricao,price:num(o.preco),old_price:num(o.preco_anterior),category_id:C[o.categoria],merchant_id:M[o.loja],affiliate_url:o.link,featured:sim(o.destaque),offer:sim(o.oferta),...(o.preco_maximo?{price_max:num(o.preco_maximo)}:{})}).select('id').single();
    if(error)continue;n++;if(/^https?:\/\//i.test(o.imagem_url))await sb.from('cr_product_images').insert({product_id:p.id,url:o.imagem_url,sort:0,is_cover:true})}
   alert(n+' produto(s) importado(s).');imp(el)})}}
// ---------- Temas sazonais
async function temas(el){
 const {data:st}=await sb.from('cr_site_settings').select('data').eq('id',1).maybeSingle();const c0=st?.data?.theme_cfg||{};
 const ALL={...THEMES,custom:{n:'Personalizado',e:'✨',c1:'#0b2a5b',c2:'#1e6bff',btn:'#1e6bff',t:'',fx:[]}};
 let key=ALL[c0.key]?c0.key:'natal';const v={on:!!c0.on,col:c0.colors!==false,fx:c0.fx!==false,area:c0.area==='top'?'top':'all',snd:!!c0.snd,text:c0.text||'',link:c0.link||'',start:c0.start||'',end:c0.end||'',cu:{emoji:'✨',c1:'#0b2a5b',c2:'#1e6bff',btn:'#1e6bff',...(c0.custom||{})}};

  <button class="btn sm" id=ssv>Salvar configurações</button></div>
 <h3>Histórico</h3><div class=tw><table><tr><th>Data<th>Título<th>Origem<th>Status<th>Enviados<th>Falhas<th>Cliques<th></tr>${H.map(x=>`<tr><td>${brDate(x.sent_at||x.scheduled_at||x.created_at)}<td>${esc(x.title)}<td>${NSRC[x.source]||esc(x.source)}<td${x.error?` title="${esc(x.error)}"`:''}>${NST[x.status]||esc(x.status)}${x.error?' <span class=note>ⓘ</span>':''}<td>${x.sent_count||0}<td>${x.failed_count||0}<td>${x.clicks||0}<td>${
  x.status==='scheduled'?`<button class="btn alt sm" data-nc="${x.id}">Cancelar</button>`:x.status==='draft'?`<button class="btn alt sm" data-ne="${x.id}">Editar</button><button class="btn alt sm" data-nd="${x.id}">Excluir</button>`:x.status==='failed'?`<button class="btn alt sm" data-nr="${x.id}">Tentar de novo</button>`:''}</tr>`).join('')||'<tr><td colspan=8>Nenhuma notificação ainda.</td></tr>'}</table></div>
 <p class=note>Datas no horário de Brasília. Passe o dedo/mouse em “Falhou” para ver o motivo.</p>`;
 const t=$('#nft'),b=$('#nfb'),im=$('#nfi'),u=$('#nfu'),ps=$('#nfp'),msg=m=>$('#nfmsg').textContent=m;
 const pv=()=>{$('#pvt').textContent=t.value||'Título da notificação';$('#pvb').textContent=b.value||'Sua mensagem aparece aqui.';const i=$('#pvi');i.style.display=im.value?'block':'none';if(im.value)i.src=im.value;
  $('#nftc').textContent=t.value.length+'/80';$('#nfbc').textContent=b.value.length+'/200';$('#nfclock').textContent=new Date().toLocaleTimeString('pt-BR',{timeZone:BR,hour:'2-digit',minute:'2-digit'})};
 [t,b,im].forEach(i=>i.oninput=pv);im.onchange=pv;pv();
 $('#nfq').oninput=e=>{const q=e.target.value.toLowerCase();[...ps.options].forEach(o=>{if(o.value)o.hidden=!!q&&!o.text.toLowerCase().includes(q)})};
 ps.onchange=()=>{const p=P.find(x=>x.id===ps.value);if(!p)return;u.value=plink(p);const i=pimg(p);if(i)im.value=i;if(!t.value)t.value=p.name.slice(0,80);pv()};
 $('#nff').onchange=e=>run(async()=>{if(!e.target.files[0])return;msg('Enviando imagem…');im.value=await up(e.target.files[0]);msg('');pv()});
 const row=extra=>{const ti=t.value.trim(),bo=b.value.trim();if(!ti)throw new Error('Escreva o título.');if(ti.length>80||bo.length>200)throw new Error('Título até 80 e mensagem até 200 caracteres.');
  const im2=im.value.trim(),u2=u.value.trim();if(im2&&!/^https?:\/\//i.test(im2))throw new Error('A imagem deve ser um link começando com https://');if(u2&&!/^https?:\/\//i.test(u2))throw new Error('O link deve começar com https://');
  return {title:ti,body:bo||null,image_url:im2||null,url:u2||site,product_id:ps.value||null,source:'manual',error:null,...extra}};
 const save=async r=>{const q=ed?sb.from('cr_notifications').update(r).eq('id',ed.id):sb.from('cr_notifications').insert(r);const {data,error}=await q.select('id').single();if(error)throw error;return data.id};
 const busy=async(btn,f)=>{const all=el.querySelectorAll('.box button');all.forEach(x=>x.disabled=true);try{await run(f)}finally{all.forEach(x=>x.disabled=false)}};
 $('#nfnow').onclick=e=>busy(e.target,async()=>{const r=row({status:'scheduled',scheduled_at:new Date().toISOString()});if(!confirm(`Enviar agora para ${nSubs} inscrito(s)?`))return;
  msg('Enviando…');const id=await save(r);const res=await callPush({notification_id:id}),x=res?.result||{};
  alert(x.skipped?'O agendador já pegou esta notificação; ela está sendo enviada.':x.status==='sent'?`Enviada! ✅ Entregues: ${x.ok??0} · falhas: ${x.fail??0}`:'Não foi possível enviar: '+(x.error||x.lastError||'erro desconhecido'));notif(el)});
 $('#nfsch').onclick=e=>busy(e.target,async()=>{const v=$('#nfd').value;if(!v)throw new Error('Escolha a data e a hora.');const d=brParse(v);if(isNaN(d))throw new Error('Data inválida.');
  if(d<Date.now()-6e4)throw new Error('Escolha um horário no futuro.');await save(row({status:'scheduled',scheduled_at:d.toISOString()}));alert('Agendada para '+brDate(d)+' (Brasília).');notif(el)});
 $('#nfdraft').onclick=e=>busy(e.target,async()=>{await save(row({status:'draft',scheduled_at:null}));alert('Rascunho salvo.');notif(el)});
 $('#nftest').onclick=e=>busy(e.target,async()=>{let sub=await currentSub();
  if(!sub){if(!confirm('Este aparelho ainda não recebe notificações. Ativar agora? (o navegador vai pedir permissão)'))return;sub=await pushSubscribe()}
  msg('Enviando teste…');const r=await callPush({mode:'test',endpoint:sub.endpoint,title:t.value.trim()||undefined,body:b.value.trim()||undefined,image:im.value.trim()||undefined,url:u.value.trim()||undefined});
  msg(r?.ok?'Teste enviado ✅ — deve chegar em alguns segundos.':'O teste falhou: '+(r?.lastError||'sem detalhes'))});
 if(ed)$('#nfnew').onclick=()=>notif(el);
 $('#ssv').onclick=e=>busy(e.target,async()=>{const n=(id,mi,ma)=>Math.min(ma,Math.max(mi,parseInt($(id).value,10)||0));
  const {error}=await sb.from('cr_notification_settings').update({auto_new:$('#sa1').checked,auto_offer:$('#sa2').checked,auto_ending:$('#sa3').checked,ending_hours:n('#seh',1,168),daily_limit:n('#sdl',0,50),quiet_start:+$('#sqs').value,quiet_end:+$('#sqe').value,updated_at:new Date().toISOString()}).eq('id',1);
  if(error)throw error;alert('Configurações salvas.')});
 el.querySelectorAll('[data-nc]').forEach(x=>x.onclick=()=>run(async()=>{if(!confirm('Cancelar esta notificação agendada?'))return;const {error}=await sb.from('cr_notifications').update({status:'cancelled'}).eq('id',x.dataset.nc).eq('status','scheduled');if(error)throw error;notif(el)}));
 el.querySelectorAll('[data-nd]').forEach(x=>x.onclick=()=>run(async()=>{if(!confirm('Excluir este rascunho?'))return;const {error}=await sb.from('cr_notifications').delete().eq('id',x.dataset.nd).eq('status','draft');if(error)throw error;notif(el)}));
 el.querySelectorAll('[data-ne]').forEach(x=>x.onclick=()=>{notif(el,x.dataset.ne);scrollTo(0,0)});
 el.querySelectorAll('[data-nr]').forEach(x=>x.onclick=()=>run(async()=>{if(!confirm('Tentar enviar de novo?'))return;const res=await callPush({notification_id:x.dataset.nr}),y=res?.result||{};alert(y.status==='sent'?`Enviada! ✅ Entregues: ${y.ok??0} · falhas: ${y.fail??0}`:'Falhou de novo: '+(y.error||y.lastError||y.skipped||''));notif(el)}))}

init();
</script></body></html>
