<!doctype html><html lang=pt-BR><head><meta charset=utf-8><script>/* tema: claro por padrão; "auto" segue o tema do celular */try{if(localStorage.getItem("cr_tema")==="auto")document.documentElement.dataset.tema="auto"}catch(e){}</script><meta name=viewport content="width=device-width,initial-scale=1"><title>x</title><meta name=robots content=noindex><link rel=stylesheet href=css/style.css><link rel=manifest href=manifest.json><meta name=theme-color content="#0b2a5b"><link rel=icon href=icon-192.png><link rel=apple-touch-icon href=apple-touch-icon.png><meta name=mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-title content="Compras Rápidas"></head>
<body><div id=hdr></div><main class=w id=m></main><div id=ftr></div>
<script type=module>
import {sb,boot,esc,qs,$} from './js/app.js';
import {SUPABASE_URL,SUPABASE_KEY} from './config.js';
await boot();const id=qs('id')||'';
const {data:p}=await sb.from('cr_products').select('id,name,affiliate_url,merchants:cr_merchants(name)').eq('id',id).eq('status','active').maybeSingle();
if(!p||!/^https?:\/\//i.test(p.affiliate_url)){$('#m').innerHTML='<p>Produto indisponível.</p><a class=btn href=index.html>Início</a>';throw 0}
const store=p.merchants?.name||'loja parceira';
$('#m').innerHTML=`<div class=box style="max-width:560px;margin:30px auto;text-align:center"><h1>Você está saindo da Compras Rápidas.</h1><p>Este produto será aberto na loja parceira. O pagamento, a entrega e as condições de compra são administrados pela própria loja.</p>
<p><b>${esc(p.name)}</b><br>Loja de destino: <b>${esc(store)}</b></p><button id=go class="btn big">Continuar para a loja parceira</button><p><a class="btn alt big" href="produto.html?id=${p.id}">Voltar ao produto</a></p></div>`;
// clique: enviado com keepalive, que termina de gravar mesmo depois que a página troca para a loja (antes, em internet lenta, o clique se perdia)
let gone=false;const leave=()=>{try{top.location.href=p.affiliate_url}catch(e){location.href=p.affiliate_url}};
$('#go').onclick=()=>{if(gone)return;gone=true;$('#go').textContent='Abrindo a loja…';
 try{fetch(SUPABASE_URL+'/rest/v1/cr_click_events',{method:'POST',keepalive:true,headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({product_id:p.id})}).catch(()=>{})}catch(e){}
 setTimeout(leave,150)};
addEventListener('pageshow',e=>{if(e.persisted){gone=false;$('#go').textContent='Continuar para a loja parceira'}}); // voltou da loja pelo botão Voltar
</script></body></html>
