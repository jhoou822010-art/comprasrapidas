<!doctype html><html lang=pt-BR><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>x</title><link rel=stylesheet href=css/style.css><link rel=manifest href=manifest.json><meta name=theme-color content="#0b2a5b"><link rel=icon href=icon-192.png><link rel=apple-touch-icon href=apple-touch-icon.png><meta name=mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-title content="Compras Rápidas">
<style>
.car{position:relative;margin:14px 0;border-radius:14px;overflow:hidden}
.trk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}.trk::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;position:relative;min-height:240px;display:flex;align-items:center;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2)) center/cover no-repeat}
@media(min-width:800px){.sl{min-height:340px}}
.sl::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000b,#0006 50%,#0002)}.sl.nt::before{display:none}
.sl>div{position:relative;padding:28px 24px 40px;max-width:620px}
.sl h1,.sl h2{margin:0 0 8px;font-size:clamp(1.5rem,5vw,2.6rem);line-height:1.15;text-shadow:0 2px 8px #0009}.sl p{margin:0 0 16px;text-shadow:0 1px 6px #0009}
.hb{display:inline-block;background:var(--btn);color:#fff;font-weight:700;padding:12px 26px;border-radius:999px;border:2px solid #fff;box-shadow:0 4px 14px #0006}.hb:hover{filter:brightness(1.1)}
.nv{position:absolute;top:50%;transform:translateY(-50%);background:#0007;color:#fff;border:0;width:40px;height:40px;border-radius:50%;font-size:1.6rem;cursor:pointer}#pv{left:8px}#nx{right:8px}
@media(max-width:600px){.nv{display:none}}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:8px}.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#fff8;padding:0;cursor:pointer}.dots button.on{background:#fff}
.pcw{position:relative}.pc{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 8px}.pc::-webkit-scrollbar{display:none}
.pc .card{flex:0 0 calc(50% - 5px);scroll-snap-align:start}@media(min-width:640px){.pc .card{flex-basis:calc(33.333% - 7px)}}@media(min-width:1000px){.pc .card{flex-basis:calc(25% - 8px)}}
#ppv{left:4px}#pnx{right:4px}
</style></head>
<body><div id=hdr></div><main class=w id=m></main><div id=ftr></div>
<script type=module>
import {sb,boot,list,card,esc,byIds,decorHero} from './js/app.js';
const pre=Promise.all([sb.from('cr_banners').select('*').eq('active',true).order('sort').limit(8),sb.from('cr_homepage_sections').select('*').eq('visible',true).order('sort')]);
const S=await boot();
const [{data:bn},{data:sec}]=await pre;
const bs=bn?.length?bn:[{title:'Encontre o que procura!',subtitle:'Produtos selecionados, novidades e oportunidades em um só lugar.',button_text:'Ver ofertas',button_url:'lista.html?tipo=ofertas'}];
const cssUrl=u=>encodeURI(u).replace(/[()']/g,c=>'%'+c.charCodeAt(0).toString(16));
const link=u=>/^(https?:\/\/|[\w.\/?=&%-]+$)/i.test(u||'')?u:'#';
const slide=(b,i)=>{const T=i?'h2':'h1',txt=b.title||b.subtitle||b.button_text;
 return `<div class="sl${txt?'':' nt'}"${b.image_url?` style="background-image:url('${esc(cssUrl(b.image_url))}')"`:''}>${txt?`<div>${b.title?`<${T}>${esc(b.title)}</${T}>`:''}${b.subtitle?`<p>${esc(b.subtitle)}</p>`:''}${b.button_text?`<a class=hb href="${esc(link(b.button_url))}">${esc(b.button_text)} →</a>`:''}</div>`:''}</div>`};
let h=`<div class=car><div class=trk id=trk>${bs.map(slide).join('')}</div>${bs.length>1?`<button class=nv id=pv aria-label=Anterior>‹</button><button class=nv id=nx aria-label=Próximo>›</button><div class=dots id=dots>${bs.map((_,i)=>`<button aria-label="Banner ${i+1}"></button>`).join('')}</div>`:''}</div>`;
const seen=new Set();const cids=Array.isArray(S.carousel_ids)?S.carousel_ids:[];const useCar=S.carousel_on!==false&&cids.length;
// busca o carrossel e todas as seções ao mesmo tempo (antes era uma depois da outra)
let extra=useCar?cids.length:0;
const jobs=(sec||[]).map(x=>{if(x.key==='categorias')return sb.from('cr_categories').select('*').eq('active',true).order('sort').limit(x.qty||12);
 const q=x.qty||8,per=q+extra;extra+=q;return list({offer:x.key==='ofertas',featured:x.key==='destaques',per})});
const [cp,...res]=await Promise.all([useCar?byIds(cids):[],...jobs]);
if(cp.length){cp.forEach(p=>seen.add(p.id));
 h+=`<div class=sh><h2>${esc(S.carousel_title||'Em destaque na vitrine')}</h2></div><div class=pcw><div class=pc id=pc>${cp.map(card).join('')}</div>${cp.length>2?'<button class=nv id=ppv aria-label=Anterior>‹</button><button class=nv id=pnx aria-label=Próximo>›</button>':''}</div>`}
for(const [n,x] of (sec||[]).entries()){
 if(x.key==='categorias'){const {data}=res[n];
  if(data?.length)h+=`<div class=sh><h2>${esc(x.title)}</h2><a href="lista.html?tipo=categorias">Ver todas</a></div><div class=cats>${data.map(c=>`<a class=cat href="lista.html?tipo=categoria&slug=${esc(c.slug)}">${c.image_url?`<img loading=lazy src="${esc(c.image_url)}" alt="">`:`<i>${esc(c.name[0])}</i>`}${esc(c.name)}</a>`).join('')}</div>`;continue}
 const q=x.qty||8;const all=res[n].data;
 const data=all.filter(p=>!seen.has(p.id)).slice(0,q);data.forEach(p=>seen.add(p.id));
 if(data.length)h+=`<div class=sh><h2>${esc(x.title)}</h2><a href="lista.html?tipo=${x.key==='novidades'?'busca':x.key}">Ver todos</a></div><div class=grid>${data.map(card).join('')}</div>`}
if(!sec?.length)h+='<p>Nenhuma seção configurada.</p>';
document.getElementById('m').innerHTML=h;decorHero();
{const pc=document.getElementById('pc');if(pc){const step=()=>{const c=pc.querySelector('.card');return c?c.getBoundingClientRect().width+10:300};
 const nxt=()=>{if(pc.scrollLeft+pc.clientWidth>=pc.scrollWidth-4)pc.scrollTo({left:0,behavior:'smooth'});else pc.scrollBy({left:step(),behavior:'smooth'})};
 const a=document.getElementById('ppv'),b=document.getElementById('pnx');if(a){a.onclick=()=>pc.scrollBy({left:-step(),behavior:'smooth'});b.onclick=nxt}
 let t;const st=()=>clearInterval(t),rs=()=>{st();if(pc.children.length>2&&!matchMedia('(prefers-reduced-motion:reduce)').matches)t=setInterval(nxt,4000)};
 ['mouseenter','touchstart','focusin'].forEach(e=>pc.addEventListener(e,st,{passive:true}));['mouseleave','touchend','focusout'].forEach(e=>pc.addEventListener(e,rs,{passive:true}));rs()}}
if(bs.length>1){const trk=document.getElementById('trk'),dots=[...document.querySelectorAll('#dots button')];let i=0,t;
 const go=n=>{i=(n+bs.length)%bs.length;trk.scrollTo({left:i*trk.clientWidth,behavior:'smooth'})};
 const mark=()=>{i=Math.round(trk.scrollLeft/trk.clientWidth);dots.forEach((d,k)=>d.classList.toggle('on',k===i))};
 const st=()=>clearInterval(t),rs=()=>{st();if(!matchMedia('(prefers-reduced-motion:reduce)').matches)t=setInterval(()=>go(i+1),5000)};
 trk.addEventListener('scroll',mark,{passive:true});
 document.getElementById('pv').onclick=()=>{go(i-1);rs()};document.getElementById('nx').onclick=()=>{go(i+1);rs()};dots.forEach((d,k)=>d.onclick=()=>{go(k);rs()});
 ['mouseenter','touchstart','focusin'].forEach(e=>trk.addEventListener(e,st,{passive:true}));['mouseleave','touchend','focusout'].forEach(e=>trk.addEventListener(e,rs,{passive:true}));
 mark();rs()}
</script></body></html>
