<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="color-scheme" content="only light"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Gestor | Compras Rápidas</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b2a5b"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Gestor">
<style>
:root{--c1:#0b2a5b;--c2:#1e6bff;--h:60px}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--c1);font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#fr{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(var(--h) + env(safe-area-inset-bottom,0px))}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}iframe.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--c1);display:flex}
nav button{flex:1;border:0;background:none;color:#ffffffa0;font:inherit;font-size:.8rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav button b{font-size:1.4rem;line-height:1;font-weight:400}nav button.on{color:#fff;box-shadow:inset 0 3px 0 var(--c2)}
</style></head><body>
<div id="fr"></div>
<nav><button data-k="loja"><b>🛍️</b>Loja</button><button data-k="painel"><b>⚙️</b>Painel</button><button id="rl"><b>↻</b>Atualizar</button></nav>
<script>
var T={loja:"../index.html",painel:"../admin/"},F={},cur="loja";
function show(k){
  cur=k;try{localStorage.setItem("gestor-aba",k)}catch(e){}
  if(!F[k]){var f=document.createElement("iframe");f.src=T[k];f.title=k;document.getElementById("fr").appendChild(f);F[k]=f}
  for(var n in F)F[n].classList.toggle("on",n===k);
  document.querySelectorAll("nav [data-k]").forEach(function(b){b.classList.toggle("on",b.dataset.k===k)})
}
document.querySelectorAll("nav [data-k]").forEach(function(b){b.onclick=function(){show(b.dataset.k)}});
document.getElementById("rl").onclick=function(){try{F[cur].contentWindow.location.reload()}catch(e){F[cur].src=T[cur]}};
var s="loja";try{s=localStorage.getItem("gestor-aba")||"loja"}catch(e){}
show(T[s]?s:"loja");
</script></body></html>
