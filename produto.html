<!doctype html><html lang=pt-BR><head><meta charset=utf-8><script>/* tema: claro por padrão; "auto" segue o tema do celular */try{if(localStorage.getItem("cr_tema")==="auto")document.documentElement.dataset.tema="auto"}catch(e){}</script><meta name=viewport content="width=device-width,initial-scale=1"><title>x</title><link rel=stylesheet href=css/style.css><link rel=manifest href=manifest.json><meta name=theme-color content="#0b2a5b"><link rel=icon href=icon-192.png><link rel=apple-touch-icon href=apple-touch-icon.png><meta name=mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-title content="Compras Rápidas"><style>#bb{display:none}@media(max-width:799px){body{padding-bottom:84px}#bb{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid #cdd8e8;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));gap:12px;align-items:center;justify-content:space-between;box-shadow:0 -2px 10px #0002}#bb .btn{flex:1;font-weight:700}}</style></head>
<body><div id=hdr></div><main class=w id=m></main><div id=ftr></div>
<script type=module>
import {sb,boot,list,card,esc,money,qs,isOffer,showOld,$,safeUrl,priceTxt,isRange,shortUrl,fromShort,copyTxt} from './js/app.js';
const pq0=sb.from('cr_products').select('*,merchants:cr_merchants(name),categories:cr_categories(name),product_images:cr_product_images(url,sort),product_videos:cr_product_videos(url,sort)').eq('status','active');
const hc=fromShort(qs('c'));// link curto: busca o produto cujo id começa com o código
const pq=Promise.resolve(hc?pq0.gte('id',hc+'-0000-0000-0000-000000000000').lte('id',hc+'-ffff-ffff-ffff-ffffffffffff').order('id').limit(1).maybeSingle():pq0.eq(qs('id')?'id':'slug',qs('id')||qs('produto')||'').maybeSingle());
const S=await boot();const m=$('#m');const {data:p}=await pq;
if(!p){m.innerHTML='<p>Produto não encontrado.</p><a class=btn href=index.html>Voltar ao início</a>';throw 0}
document.title=p.name+' | '+S.name;
const imgs=[...p.product_images].sort((a,b)=>a.sort-b.sort).map(i=>i.url);
const embed=u=>{u=safeUrl(u);let y=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/),v=u.match(/vimeo\.com\/(\d+)/);
 if(y)return `<iframe class=vid loading=lazy allowfullscreen src="https://www.youtube.com/embed/${y[1]}"></iframe>`;
 if(v)return `<iframe class=vid loading=lazy allowfullscreen src="https://player.vimeo.com/video/${v[1]}"></iframe>`;
 if(u!=='#')return `<video class=vid controls preload=metadata src="${esc(u)}"></video>`;return ''};
const o=isOffer(p);
const wa='https://wa.me/?text='+encodeURIComponent(p.name+(p.price!=null?' por '+(isRange(p)?money(p.price)+' a '+money(p.price_max):money(p.price)):'')+'\n'+shortUrl(p.id));
m.innerHTML=`<div class=pd><div class=gal><div class=main id=mi><img id=big alt="${esc(p.name)}"></div><div class=th>${imgs.map((u,i)=>`<img data-i=${i} src="${esc(u)}" alt="">`).join('')}</div></div>
<div><h1>${esc(p.name)}</h1>${o?'<span class=tag style="position:static;display:inline-block">Oferta</span>':''}
<div class=pr style="margin:8px 0">${p.price!=null?`<b style="font-size:${isRange(p)?'1.5rem':'1.8rem'}">${priceTxt(p)}</b>`:''}${showOld(p)?`<s>${money(p.old_price)}</s>`:''}</div>
<p class=note>Preço informativo, sujeito às condições da loja de destino.</p><p>Loja parceira: <b>${esc(p.merchants?.name||'—')}</b></p>
<a class="btn big" href="saindo.html?id=${p.id}">Comprar</a><a class="btn alt big" style="margin-top:8px" target=_blank rel=noopener href="${esc(wa)}">Compartilhar no WhatsApp</a><button type=button class="btn alt big" style="margin-top:8px" id=lc>🔗 Copiar link curto</button><div class=box style="white-space:pre-line">${esc(p.description||'')}</div></div></div>
${p.product_videos.length?`<h2>Vídeos</h2>${[...p.product_videos].sort((a,b)=>a.sort-b.sort).map(v=>embed(v.url)).join('')}`:''}<div id=rel></div>`;
document.body.insertAdjacentHTML('beforeend',`<div id=bb><span class=pr><b${isRange(p)?' class=rg':''}>${priceTxt(p)}</b></span><a class=btn href="saindo.html?id=${p.id}">Comprar agora</a></div>`);
$('#lc').onclick=async()=>{const b=$('#lc'),u=shortUrl(p.id);b.textContent=await copyTxt(u)?'✅ Link copiado!':u;setTimeout(()=>b.textContent='🔗 Copiar link curto',2500)};
let i=0;const big=$('#big'),lb=$('#lb');
const show=n=>{if(!imgs.length)return;i=(n+imgs.length)%imgs.length;big.src=imgs[i];document.querySelectorAll('.th img').forEach((e,k)=>e.classList.toggle('on',k===i));if(lb.classList.contains('on'))$('#lbi').src=imgs[i]};show(0);
document.querySelectorAll('.th img').forEach(e=>e.onclick=()=>show(+e.dataset.i));
let x0;$('#mi').addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});$('#mi').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)show(i+(d<0?1:-1))});
lb.innerHTML='<img id=lbi alt=""><button style="left:8px">‹</button><button style="right:8px">›</button><button style="top:8px;right:8px">×</button>';
const bt=lb.querySelectorAll('button');bt[0].onclick=e=>{e.stopPropagation();show(i-1)};bt[1].onclick=e=>{e.stopPropagation();show(i+1)};bt[2].onclick=()=>lb.classList.remove('on');lb.onclick=e=>{if(e.target===lb)lb.classList.remove('on')};
big.onclick=()=>{if(imgs.length){lb.classList.add('on');$('#lbi').src=imgs[i]}};
const {data:rel}=await list({cat:p.category_id,per:5});const r=rel.filter(x=>x.id!==p.id).slice(0,4);
if(r.length)$('#rel').innerHTML=`<div class=sh><h2>Produtos relacionados</h2></div><div class=grid>${r.map(card).join('')}</div>`;
</script></body></html>
