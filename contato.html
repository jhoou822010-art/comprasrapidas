<!doctype html><html lang=pt-BR><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Contato</title><link rel=stylesheet href=css/style.css><link rel=manifest href=manifest.json><meta name=theme-color content="#0b2a5b"><link rel=icon href=icon-192.png><link rel=apple-touch-icon href=apple-touch-icon.png><meta name=mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-title content="Compras Rápidas">
<style>
.ch{position:relative;margin:14px 0 18px;border-radius:16px;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2)) center/cover no-repeat;padding:34px 22px;text-align:center}
.ch.img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0008,#000a)}.ch>*{position:relative}
.ch .lg{width:88px;height:88px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid #fff;margin:0 auto 10px;box-shadow:0 4px 14px #0004}
.ch .sn{font-weight:600;opacity:.9;letter-spacing:.02em}.ch h1{margin:4px 0 8px;font-size:clamp(1.6rem,5vw,2.6rem);line-height:1.15;text-shadow:0 2px 8px #0006}
.ch p{margin:0 auto;max-width:640px;white-space:pre-line;text-shadow:0 1px 6px #0006}
.ch .hb{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;margin-top:18px;background:#25D366;color:#fff;font-weight:700;padding:12px 24px;border-radius:999px;border:2px solid #fff;box-shadow:0 4px 14px #0005}.ch .hb:hover{filter:brightness(1.08)}
.cs{margin:22px 0}.cs h2{margin:0 0 10px;color:var(--c1);font-size:1.25rem}
.cg{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ci{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 4px #0001;transition:.15s;min-width:0}
a.ci:hover{transform:translateY(-2px);box-shadow:0 4px 14px #0002}.ci .cic{flex:0 0 auto;border-radius:11px;object-fit:cover}
.ci span{flex:1;min-width:0}.ci b{display:block}.ci small{display:block;color:#556;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ci i{font-style:normal;color:var(--c2);font-size:1.3rem}
.ct{background:#fff;border-radius:14px;padding:16px 18px;white-space:pre-line;box-shadow:0 1px 4px #0001}
</style></head>
<body><div id=hdr></div><main class=w id=m></main><div id=ftr></div>
<script type=module>
import {boot,esc,$,contactCfg,CTYPES,CBLOCKS,cIcon,cHref} from './js/app.js';
const S=await boot();const C=contactCfg(S);
document.title='Contato | '+(S.seo_title||S.name);
const cssUrl=u=>encodeURI(u).replace(/[()']/g,c=>'%'+c.charCodeAt(0).toString(16));
const img=u=>/^https?:\/\//i.test(u||'')?u:'';
const items=(C.items||[]).filter(it=>it.on!==false&&(it.value||'').trim());
const logo=C.show_logo===false?'':img(C.logo)||img(S.logo),cover=img(C.cover);
const wa=items.find(it=>it.type==='whatsapp'&&cHref(it));
const cardH=it=>{const t=CTYPES[it.type]||CTYPES.site,h=cHref(it),ext=/^https?:/i.test(h),lab=esc(it.label||t.n),val=esc(it.value);
 const inner=`${cIcon(it)}<span><b>${lab}</b><small>${val}</small></span>`;
 return h?`<a class=ci href="${esc(h)}"${ext?' target=_blank rel=noopener':''}>${inner}<i aria-hidden=true>›</i></a>`:`<div class=ci>${inner}</div>`};
const block=b=>{const title=esc(b.t||CBLOCKS[b.k]||'');
 if(b.k==='sobre')return C.about?.trim()?`<section class=cs><h2>${title}</h2><div class=ct>${esc(C.about)}</div></section>`:'';
 if(b.k==='horario')return C.hours?.trim()?`<section class=cs><h2>${title}</h2><div class=ct>${esc(C.hours)}</div></section>`:'';
 const L=items.filter(it=>(CTYPES[it.type]||CTYPES.site).g===b.k);return L.length?`<section class=cs><h2>${title}</h2><div class=cg>${L.map(cardH).join('')}</div></section>`:''};
const body=(C.blocks||[]).filter(b=>b.on!==false).map(block).join('');
$('#m').innerHTML=`<div class="ch${cover?' img':''}"${cover?` style="background-image:url('${esc(cssUrl(cover))}')"`:''}>${logo?`<img class=lg src="${esc(logo)}" alt="">`:''}<div class=sn>${esc(C.store_name||S.name)}</div><h1>${esc(C.title||'Contato')}</h1>${C.subtitle?`<p>${esc(C.subtitle)}</p>`:''}${wa?`<a class=hb href="${esc(cHref(wa))}" target=_blank rel=noopener>${cIcon({type:'whatsapp',color:'transparent'},24)} Chamar no WhatsApp</a>`:''}</div>
${body||'<div class=ct>Em breve, nossos canais de atendimento estarão disponíveis aqui.</div>'}`;
</script></body></html>
